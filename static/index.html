<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Web SSH</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1e1e1e; color: #d4d4d4; font-family: sans-serif; }
        #terminal-container { width: 100%; height: 100vh; }
        .login-panel {
            position: absolute; top: 30%; left: 50%;
            transform: translate(-50%, -30%);
            background: #2d2d2d; padding: 30px; border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: none;
        }
        .login-panel input, .login-panel button {
            display: block; width: 100%; margin: 10px 0; padding: 8px;
            border: 1px solid #555; background: #3c3c3c; color: #ccc;
        }
        .login-panel button { cursor: pointer; background: #007acc; border: none; }
        .info-bar { padding: 5px 10px; background: #007acc; color: white; }
    </style>
</head>
<body>
    <div class="info-bar">
        <span id="status">Not connected</span>
        <button id="logoutBtn" style="float:right; background:#d9534f; border:none; color:white; padding:2px 10px; cursor:pointer;">Logout</button>
    </div>
    <div id="terminal-container"></div>
    <div class="login-panel" id="loginPanel">
        <h3>Login</h3>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button id="loginBtn">Login</button>
        <p style="margin-top:10px;">No account? <a href="#" id="showRegister" style="color:#007acc;">Register</a></p>
    </div>
    <div class="login-panel" id="registerPanel">
        <h3>Register</h3>
        <input type="text" id="regUser" placeholder="Username">
        <input type="password" id="regPass" placeholder="Password">
        <button id="registerBtn">Register</button>
        <p style="margin-top:10px;"><a href="#" id="showLogin" style="color:#007acc;">Back to Login</a></p>
    </div>
    <div class="login-panel" id="sshPanel">
        <h3>SSH Connection</h3>
        <input type="text" id="sshHost" placeholder="Host (IP)">
        <input type="number" id="sshPort" placeholder="Port" value="22">
        <input type="text" id="sshUser" placeholder="SSH Username">
        <input type="password" id="sshPass" placeholder="SSH Password">
        <button id="connectBtn">Connect</button>
    </div>

    <script>
        const term = new Terminal({ cursorBlink: true, fontSize: 14 });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        let token = localStorage.getItem('token');
        let ws = null;

        function showPanel(panelId) {
            document.querySelectorAll('.login-panel').forEach(p => p.style.display = 'none');
            document.getElementById(panelId).style.display = 'block';
        }

        if (token) {
            showPanel('sshPanel');
        } else {
            showPanel('loginPanel');
        }

        document.getElementById('showRegister').onclick = e => { e.preventDefault(); showPanel('registerPanel'); };
        document.getElementById('showLogin').onclick = e => { e.preventDefault(); showPanel('loginPanel'); };
        document.getElementById('logoutBtn').onclick = () => {
            localStorage.removeItem('token');
            token = null;
            if (ws) ws.close();
            location.reload();
        };

        document.getElementById('loginBtn').onclick = async () => {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass})
            });
            const data = await res.json();
            if (data.token) {
                token = data.token;
                localStorage.setItem('token', token);
                showPanel('sshPanel');
            } else {
                alert(data.error || 'Login failed');
            }
        };

        document.getElementById('registerBtn').onclick = async () => {
            const user = document.getElementById('regUser').value;
            const pass = document.getElementById('regPass').value;
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass})
            });
            if (res.ok) {
                alert('Registration successful, please login');
                showPanel('loginPanel');
            } else {
                const data = await res.json();
                alert(data.error || 'Registration failed');
            }
        };

        document.getElementById('connectBtn').onclick = () => {
            if (ws) ws.close();
            const host = document.getElementById('sshHost').value;
            const port = parseInt(document.getElementById('sshPort').value) || 22;
            const user = document.getElementById('sshUser').value;
            const pass = document.getElementById('sshPass').value;

            const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/ws/ssh?token=${token}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                ws.send(JSON.stringify({host, port, user, password: pass}));
                document.getElementById('status').innerText = `Connected to ${host}`;
            };

            ws.onmessage = (event) => {
                term.write(new Uint8Array(event.data));
            };

            ws.onclose = () => {
                document.getElementById('status').innerText = 'Disconnected';
            };

            term.onData(data => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(data);
                }
            });
        };

        window.onresize = () => fitAddon.fit();
    </script>
</body>
</html>
